[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "section-library"
version = "0.1.0"
description = "Source-grounded section library for traceable project knowledge."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
section-library = "library_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
